name: Daily Robotics Paper Email

on:
  workflow_dispatch:
    inputs:
      repair_zotero:
        description: "Repair missing Zotero PDF files without sending email"
        required: false
        default: false
        type: boolean
      force_send:
        description: "Send even if today's paper was already delivered"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: daily-paper-${{ github.repository }}
  cancel-in-progress: false

jobs:
  send-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send daily paper email
        env:
          QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_COLLECTION_NAME: ${{ secrets.ZOTERO_COLLECTION_NAME }}
          ZOTERO_REPAIR_MISSING_PDFS: ${{ inputs.repair_zotero || 'false' }}
          FORCE_SEND: ${{ inputs.force_send || 'false' }}
        run: python scripts/send_daily_robotics_paper.py

      - name: Commit sent paper history
        if: ${{ !inputs.repair_zotero }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sent_papers.json
          git diff --cached --quiet || git commit -m "Record sent paper"
          if git diff HEAD^ --quiet -- data/sent_papers.json 2>/dev/null; then
            exit 0
          fi
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Failed to push sent-paper history after 3 attempts."
          exit 1
